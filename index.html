<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Be My Valentine?</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
}

h1{
    font-family:'Pacifico',cursive;
    font-size:3em;
    margin-bottom:20px;
}

button{
    padding:15px 40px;
    font-size:22px;
    border:none;
    border-radius:14px;
    position:absolute;
    cursor:pointer;
}

#yesBtn{
    background:#28a745;
    position:relative;
}

#noBtn{
    background:#dc3545;
}

img{
    width:260px;
    border-radius:20px;
    margin-top:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<h1>Will you be my Valentine? 💖</h1>
<button id="yesBtn">YES</button>
<button id="noBtn">NO</button>

<script>
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

// NO button runs away (touch + mouse)
function moveNo(){
    noBtn.style.left=Math.random()*(window.innerWidth-100)+"px";
    noBtn.style.top=Math.random()*(window.innerHeight-50)+"px";
}
noBtn.addEventListener("touchstart",moveNo);
noBtn.addEventListener("mouseover",moveNo);
moveNo();

const quotes=[
"You are my today and all of my tomorrows.",
"I’d choose you in every lifetime.",
"My favorite place is next to you.",
"You make my heart smile.",
"You are my happy place.",
"Forever wouldn’t be long enough with you.",
"You are my greatest blessing.",
"With you, life is beautiful.",
"Loving you is my favorite thing to do.",
"You are the best part of my life.",
"Every moment with you feels like magic.",
"My heart is happiest with you."
];

// YES button action
yesBtn.onclick=()=>{
    document.body.innerHTML=`
    <canvas id="canvas"></canvas>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;color:white;">
        <h1 style="font-family:Pacifico,cursive;">I love you 🤍</h1>
        <h2>Only yours</h2>
        <p style="font-size:1.5em;margin:20px;">${quotes[Math.floor(Math.random()*quotes.length)]}</p>
        <img src="IMG_6820.jpeg">
    </div>`;

    const c=document.getElementById("canvas");
    const x=c.getContext("2d");
    c.width=window.innerWidth;
    c.height=window.innerHeight;

    let hearts=[];
    for(let i=0;i<200;i++){
        hearts.push({
            x:Math.random()*c.width,
            y:Math.random()*-c.height,
            size:Math.random()*10+8,
            dy:Math.random()*3+2
        });
    }

    function drawHeart(h){
        x.beginPath();
        x.moveTo(h.x,h.y);
        x.bezierCurveTo(h.x-h.size,h.y-h.size,h.x-h.size*2,h.y+h.size,h.x,h.y+h.size*2);
        x.bezierCurveTo(h.x+h.size*2,h.y+h.size,h.x+h.size,h.y-h.size,h.x,h.y);
        x.fillStyle="pink";
        x.fill();
    }

    function animate(){
        x.clearRect(0,0,c.width,c.height);
        hearts.forEach(h=>{
            h.y+=h.dy;
            drawHeart(h);
        });
        requestAnimationFrame(animate);
    }

    animate();
};
</script>

</body>
</html>
