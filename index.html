<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Be My Valentine?</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
}

h1{
    font-family:'Pacifico',cursive;
    font-size:3em;
    margin-bottom:20px;
}

button{
    padding:15px 40px;
    font-size:20px;
    border:none;
    border-radius:14px;
    position:absolute;
    cursor:pointer;
}

#yesBtn{background:#28a745; position:relative;}
#noBtn{background:#dc3545;}

#loveScreen{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

img{
    width:260px;
    border-radius:20px;
    margin-top:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

#quoteBtn{
    margin-top:15px;
    padding:10px 25px;
    font-size:18px;
    background:#ffffff;
    color:#ff5e7e;
    border-radius:12px;
    cursor:pointer;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="main">
    <h1>Will you be my Valentine? 💖</h1>
    <button id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
</div>

<div id="loveScreen">
    <h1>I love you 🤍</h1>
    <h2>Only yours</h2>
    <p id="quote" style="font-size:1.5em;margin:15px;"></p>
    <button id="quoteBtn">Press me!</button>
    <img src="IMG_6820.jpeg">
</div>

<script>
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const main=document.getElementById("main");
const loveScreen=document.getElementById("loveScreen");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

// NO runs away
function moveNo(){
    noBtn.style.left=Math.random()*(window.innerWidth-100)+"px";
    noBtn.style.top=Math.random()*(window.innerHeight-50)+"px";
}
noBtn.addEventListener("touchstart",moveNo);
noBtn.addEventListener("mouseover",moveNo);
moveNo();

// Quotes
const quotes=[
"You are my today and all of my tomorrows.",
"My favorite place is next to you.",
"I’d choose you in every lifetime.",
"You make my heart smile.",
"Forever wouldn’t be long enough with you.",
"You are my greatest blessing.",
"With you, life is beautiful.",
"Loving you is my favorite thing to do.",
"You are the best part of my life.",
"Every moment with you feels like magic.",
"My heart is happiest with you."
];

let quoteIndex=0;
function showQuote(){
    document.getElementById("quote").innerText = quotes[quoteIndex];
    quoteIndex = (quoteIndex + 1) % quotes.length;
}

// Heart explosion
function heart(x,y,size,dy){
    this.x=x; this.y=y; this.size=size; this.dy=dy;
}

function drawHeart(h){
    ctx.beginPath();
    ctx.moveTo(h.x,h.y);
    ctx.bezierCurveTo(h.x-h.size,h.y-h.size,h.x-h.size*2,h.y+h.size,h.x,h.y+h.size*2);
    ctx.bezierCurveTo(h.x+h.size*2,h.y+h.size,h.x+h.size,h.y-h.size,h.x,h.y);
    ctx.fillStyle="pink";
    ctx.fill();
}

yesBtn.onclick=()=>{
    main.style.display="none";
    loveScreen.style.display="flex";
    showQuote();

    let hearts=[];
    for(let i=0;i<220;i++){
        hearts.push(new heart(Math.random()*canvas.width,-20,Math.random()*10+8,Math.random()*3+2));
    }

    function animate(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        hearts.forEach(h=>{
            h.y+=h.dy;
            drawHeart(h);
        });
        requestAnimationFrame(animate);
    }
    animate();
};

// Quote button
document.addEventListener("click", function(e){
    if(e.target && e.target.id==="quoteBtn"){
        showQuote();
    }
});
</script>

</body>
</html>
